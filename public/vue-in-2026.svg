<svg width="672" height="378" viewBox="0 0 672 378" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Vue in 2026 — Vapor Mode and Alien Signals</title>
<desc>Editorial cover for Vue in 2026 post showing Vue logo, Vapor Mode direct DOM connections, and Alien Signals reactivity, with badges for Vue 3.5.41 stable and 3.6 RC.</desc>
<defs>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
    <circle cx="1" cy="1" r="1" fill="#e5e7eb"/>
  </pattern>
  <linearGradient id="vaporGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#42b883" stop-opacity="0.0"/>
    <stop offset="35%" stop-color="#42b883" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.22"/>
  </linearGradient>
  <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#42d392"/>
    <stop offset="100%" stop-color="#42b883"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
</defs>

<!-- background -->
<rect width="672" height="378" rx="14" fill="#fcfcfc" stroke="#e5e7eb"/>
<rect width="672" height="378" rx="14" fill="url(#dots)" opacity="0.7"/>

<!-- thin top rule -->
<rect x="24" y="24" width="624" height="1" rx="0.5" fill="#e5e7eb"/>

<!-- Left editorial block -->
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <text x="24" y="46" font-size="9.5" font-weight="600" letter-spacing="0.14em" fill="#6b7280">DAVIDSABALETE.COM — FIELD NOTES</text>
  <text x="24" y="62" font-size="9.5" font-weight="500" letter-spacing="0.08em" fill="#9ca3af">AUG 2026 · PINNED TO 3.6.0-RC.5 · VITE 7.3.3</text>

  <text x="24" y="106" font-size="38" font-weight="750" letter-spacing="-0.03em" fill="#0f172a">Vue in 2026</text>
  <text x="24" y="134" font-size="15" font-weight="500" letter-spacing="-0.015em" fill="#334155">Vapor Mode · Alien Signals · Vite 7</text>
  <text x="24" y="158" font-size="12.5" font-weight="400" fill="#64748b">What’s stable in 3.5.41, what’s RC in 3.6,</text>
  <text x="24" y="176" font-size="12.5" font-weight="400" fill="#64748b">and where gaps remain.</text>
</g>

<!-- Vue logo mark - left -->
<g transform="translate(24, 198)">
  <!-- card behind logo -->
  <rect x="0" y="0" width="112" height="112" rx="18" fill="white" stroke="#e5e7eb" filter="url(#softShadow)"/>
  <!-- Vue mark - outer dark, inner green - simplified geometry -->
  <!-- Outer triangle -->
  <path d="M 56 18 L 92 82 L 84.5 94 L 56 46 L 27.5 94 L 20 82 Z" fill="#35495e"/>
  <!-- Inner green -->
  <path d="M 56 46 L 84.5 94 L 76.5 106 L 56 71 L 35.5 106 L 27.5 94 Z" fill="url(#logoGrad)"/>
  <!-- small shine -->
  <path d="M 27.5 94 L 35.5 106 L 43 93 L 35.2 84 Z" fill="#2e9e6f" opacity="0.95"/>
  <path d="M 84.5 94 L 76.5 106 L 69 93 L 76.8 84 Z" fill="#2e9e6f" opacity="0.95"/>
  <!-- label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="56" y="128" font-size="9" font-weight="600" letter-spacing="0.08em" fill="#0f172a">VUE 3.6 RC</text>
    <text x="56" y="139" font-size="8" font-weight="500" letter-spacing="0.06em" fill="#64748b">VAPOR · OPT-IN</text>
  </g>
</g>

<!-- Center connector vapor -->
<g opacity="0.9">
  <path d="M 150 240 C 190 210, 210 260, 250 233" fill="none" stroke="url(#vaporGrad)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 150 255 C 188 235, 220 275, 268 245" fill="none" stroke="#42b883" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5" stroke-linecap="round"/>
  <!-- arrow hint -->
  <g transform="translate(258, 232)">
    <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#0f766e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
  <text x="172" y="218" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" letter-spacing="0.08em" fill="#0f766e" opacity="0.9">COMPILED → DOM</text>
  <text x="172" y="228" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.06em" fill="#64748b">NO VDOM DIFF</text>
</g>

<!-- Right diagram - reactivity + DOM -->
<g transform="translate(296, 195)">
  <rect x="0" y="0" width="352" height="132" rx="14" fill="white" stroke="#e5e7eb" filter="url(#softShadow)"/>
  <!-- header -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="14" y="20" font-size="8.5" font-weight="700" letter-spacing="0.1em" fill="#6b7280">ALIEN SIGNALS — REACTIVITY</text>
    <text x="334" y="20" text-anchor="end" font-size="7.5" font-weight="600" letter-spacing="0.06em" fill="#94a3b8">03.5 · 03.6</text>
  </g>
  <line x1="14" y1="26" x2="338" y2="26" stroke="#f1f5f9" stroke-width="1"/>

  <!-- signal nodes -->
  <g font-family="ui-monospace, monospace">
    <!-- ref nodes -->
    <rect x="14" y="38" width="62" height="28" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="45" y="50" text-anchor="middle" font-size="7" font-weight="700" letter-spacing="0.06em" fill="#1d4ed8">ref(0)</text>
    <text x="45" y="60" text-anchor="middle" font-size="6.5" fill="#64748b">versioned</text>

    <rect x="88" y="38" width="62" height="28" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="119" y="50" text-anchor="middle" font-size="7" font-weight="700" letter-spacing="0.06em" fill="#15803d">computed</text>
    <text x="119" y="60" text-anchor="middle" font-size="6.5" fill="#64748b">lazy pull</text>

    <rect x="162" y="38" width="62" height="28" rx="8" fill="#fef3c7" stroke="#fde68a"/>
    <text x="193" y="50" text-anchor="middle" font-size="7" font-weight="700" letter-spacing="0.06em" fill="#92400e">effect</text>
    <text x="193" y="60" text-anchor="middle" font-size="6.5" fill="#64748b">push</text>

    <!-- arrows -->
    <path d="M 76 52 L 88 52" stroke="#94a3b8" stroke-width="1" marker-end="none"/>
    <path d="M 150 52 L 162 52" stroke="#94a3b8" stroke-width="1"/>

    <!-- doubly linked hint -->
    <path d="M 193 66 C 193 74, 119 74, 119 66" fill="none" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
    <text x="156" y="82" text-anchor="middle" font-size="6.5" fill="#94a3b8">doubly-linked list</text>
  </g>

  <!-- bottom DOM targets -->
  <g transform="translate(14, 90)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui" font-size="7.5" font-weight="700" letter-spacing="0.08em" fill="#6b7280">DOM TARGETS</text>
    <!-- 3 DOM nodes -->
    <g font-family="ui-monospace, monospace">
      <rect x="0" y="8" width="98" height="20" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="10" cy="18" r="3.5" fill="#42b883"/>
      <text x="18" y="22" font-size="7" font-weight="600" fill="#334155">&lt;button&gt; {{ count }}</text>

      <rect x="108" y="8" width="98" height="20" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="118" cy="18" r="3.5" fill="#22d3ee"/>
      <text x="126" y="22" font-size="7" font-weight="600" fill="#334155">&lt;p&gt; reactive</text>

      <rect x="216" y="8" width="104" height="20" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="226" cy="18" r="3.5" fill="#a78bfa"/>
      <text x="234" y="22" font-size="7" font-weight="600" fill="#334155">&lt;div vapor&gt;</text>
    </g>
    <!-- direct lines -->
    <path d="M 45 66 L 30 98" stroke="#42b883" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.7"/>
    <path d="M 193 66 L 168 98" stroke="#22d3ee" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.7"/>
    <path d="M 193 66 L 270 98" stroke="#a78bfa" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.7"/>
  </g>

  <!-- small RC badge inside card -->
  <g transform="translate(258, 44)">
    <rect x="0" y="0" width="66" height="14" rx="7" fill="#0f172a"/>
    <text x="33" y="9.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" letter-spacing="0.08em" fill="white">RC · PINNED</text>
  </g>
</g>

<!-- Bottom badgeline -->
<g transform="translate(24, 336)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="108" height="22" rx="11" fill="#0f172a"/>
  <circle cx="12" cy="11" r="4" fill="#22c55e"/>
  <text x="20" y="14.5" font-size="7.5" font-weight="700" letter-spacing="0.04em" fill="white">3.5.41 STABLE</text>

  <rect x="116" y="0" width="132" height="22" rx="11" fill="white" stroke="#e5e7eb"/>
  <circle cx="128" cy="11" r="4" fill="#f59e0b"/>
  <text x="136" y="14.5" font-size="7.5" font-weight="700" letter-spacing="0.04em" fill="#0f172a">3.6.0-RC.5 · VAPOR</text>

  <rect x="256" y="0" width="118" height="22" rx="11" fill="white" stroke="#e5e7eb"/>
  <text x="272" y="14.5" font-size="7.5" font-weight="700" letter-spacing="0.04em" fill="#334155">VITE 7 · NUXT 4</text>

  <rect x="382" y="0" width="98" height="22" rx="11" fill="white" stroke="#e5e7eb"/>
  <text x="398" y="14.5" font-size="7.5" font-weight="700" letter-spacing="0.04em" fill="#334155">PINIA 2 · R4</text>

  <g transform="translate(500, 0)">
    <text x="0" y="14.5" font-family="ui-sans-serif, system-ui" font-size="7.5" font-weight="500" letter-spacing="0.06em" fill="#94a3b8">vuejs/core</text>
    <text x="62" y="14.5" font-family="ui-monospace, monospace" font-size="7.5" fill="#cbd5e1">↗</text>
  </g>
</g>

<!-- tiny footer subtle -->
<text x="648" y="372" text-anchor="end" font-family="ui-sans-serif, system-ui" font-size="6.5" letter-spacing="0.06em" fill="#cbd5e1">LAB: @vitejs/plugin-vue 6.0.8 — measured, not benchmarked</text>
</svg>
